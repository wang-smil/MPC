# Teaching assumptions, not measured servo specs. Phase 1 demo + phase 2 A/B.
nominal_model:
  inertia: 0.019762
  damping: 0.080257
plant:
  dt_s: 0.001
  coulomb_friction: 0.12
  friction_smoothing: 0.02
  integration: semi_implicit
actuator:
  torque_limit_nm: 2.0
  slew_rate_nm_s: 50.0
  delay_s: 0.002
  time_constant_s: 0.005
demo:
  duration_s: 0.5
  control_dt_s: 0.01
mpc:
  dt_s: 0.01
  horizon_steps: 20
experiment_ab:
  duration_s: 4.0
  target_deg: 30.0
  seed: 2026
  input_rate_weights: [0.0, 0.5, 5.0]
constraints:
  position_limit_deg: 60.0
  velocity_limit_rad_s: 1.5
experiment_cde:
  duration_s: 4.0
  target_deg: 30.0
  initial_velocity_rad_s: 2.0
  seed: 2026
  slack_weights: [100.0, 10000.0, 1000000.0]
measurement:
  position_noise_std_deg: 0.05
process_noise:
  disturbance_torque_std_nm: 0.15
initial_uncertainty:
  position_std_deg: 5.0
  velocity_std_rad_s: 1.0
design_limits:
  max_position_error_deg: 5.0
  max_velocity_error_rad_s: 1.5
  max_torque_nm: 3.0  # Bryson weight scale only; actual actuator limit is 2 Nm.
