simulation:
  dt_s: 0.001
  duration_s: 5.0
  seed: 2026

model:
  inertia: 0.019762
  damping: 0.080257

measurement:
  position_noise_std_deg: 0.05

process_noise:
  disturbance_torque_std_nm: 0.15

initial_uncertainty:
  position_std_deg: 5.0
  velocity_std_rad_s: 1.0

initial_estimate:
  position_deg: 0.0
  velocity_rad_s: 0.0

initial_condition:
  q_true_deg: 20.0
  dq_true_rad_s: 0.5

controller:
  target_deg: 30.0
  max_position_error_deg: 5.0
  max_velocity_error_rad_s: 1.5
  torque_limit_nm: 3.0

actuator:
  torque_limit_nm: 3.0

disturbance:
  step_time_s: 2.0
  step_torque_nm: 0.35

stress:
  payload_scale: 1.30
  high_noise_scale: 10.0
  measurement_r_scales: [0.1, 1.0, 10.0]
  process_q_scales: [0.1, 1.0, 10.0]

velocity_difference:
  lpf_alpha: 0.90
